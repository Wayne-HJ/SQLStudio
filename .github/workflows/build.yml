name: Build SQLStudio
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package macOS
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SQLStudio-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
